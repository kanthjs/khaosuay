url: https://kanthjs.github.io/KhaoSuay/
template:
  bootstrap: 5
  bootswatch: minty
  includes:
    in_header: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  bslib:
    primary: "#2c3e50"
    link-color: "#2d6a4f"
    base_font: {google: "Mali"}
    heading_font: {google: "Mali"}
    code_font: {google: "Fira Code"}

home:
  title: "khaosuay — วิเคราะห์ข้อมูลเกษตรกรรมแบบสนุก"
  description: >
    แพ็กเกจ R สำหรับวิเคราะห์แผนการทดลองเกษตรกรรมด้วย workflow
    ที่ใช้คำอุปมาจากการหุงข้าว: ซาวข้าว ชิมข้าว หุงข้าว จัดจาน

navbar:
  bg: primary
  structure:
    left: [intro, reference, articles]
    right: [search, github]
  components:
    intro:
      text: "เริ่มต้น"
      href: articles/getting-started.html
    reference:
      text: "ฟังก์ชัน"
      href: reference/index.html
    articles:
      text: "บทความ"
      menu:
        - text: "เริ่มต้นใช้งาน khaosuay"
          href: articles/getting-started.html
        - text: "---"
        - text: "ซาวข้าวและชิมข้าว (wash + taste)"
          href: articles/wash-and-taste.html
        - text: "หุงข้าว: CRD, RCBD, Split-plot"
          href: articles/cooking-designs.html
        - text: "จัดจาน: สร้างกราฟ publication-ready"
          href: articles/plotting-results.html

reference:
  - title: "แพ็กเกจ (Package Overview)"
    desc: ภาพรวมของแพ็กเกจ khaosuay และวิธีใช้งานเบื้องต้น
    contents:
      - khaosuay-package

  - title: "ขั้นตอนที่ 1: ซาวข้าว (Data Cleaning)"
    desc: >
      ทำความสะอาดข้อมูล ตรวจ outlier ตรวจแผนการทดลอง
      แนะนำสิ่งที่ต้องพิจารณาก่อนวิเคราะห์
    contents:
      - wash_rice

  - title: "ขั้นตอนที่ 2: ชิมข้าว (Assumption Check)"
    desc: >
      ตรวจสอบ Normality และ Equal Variance
      เพื่อเลือกสถิติที่ถูกต้อง (Parametric / Non-parametric)
    contents:
      - taste_rice

  - title: "ขั้นตอนที่ 3: หุงข้าว (Statistical Analysis)"
    desc: >
      วิเคราะห์สถิติตามแผนการทดลอง เลือก ANOVA หรือ
      Kruskal-Wallis อัตโนมัติ พร้อม Post-hoc
    contents:
      - cook_crd
      - cook_rcbd
      - cook_split

  - title: "ขั้นตอนที่ 4: จัดจาน (Visualization)"
    desc: >
      สร้างกราฟ publication-ready พร้อมตัวอักษรทางสถิติ (a, b, c)
      รองรับ Bar graph และ Boxplot
    contents:
      - plot_cooked

articles:
  - title: "เริ่มต้นใช้งาน"
    navbar: ~
    contents:
      - getting-started

  - title: "คู่มือการใช้งานแต่ละขั้นตอน"
    desc: "รายละเอียดการใช้งานแต่ละฟังก์ชันอย่างละเอียด"
    contents:
      - wash-and-taste
      - cooking-designs
      - plotting-results

footer:
  structure:
    left: developed_by
    right: built_with
